name: 'Build Release APK'
description: 'Builds and signs the Android release APK'

runs:
  using: 'composite'

  steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    # 1. استرجاع مفتاح التوقيع من Secrets وتحويله إلى ملف
    - name: Decode Keystore
      shell: bash
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

    # 2. بناء التطبيق وتوقيعه باستخدام بيانات الاعتماد
    - name: Build and Sign Release APK
      shell: bash
      run: ./gradlew assembleRelease
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SIGNING_STORE_FILE: release.keystore

    # 3. خطوة اختيارية لمشاريع Android.bp
    - name: Generate Android.bp
      shell: bash
      run: |
        ./gradlew app:generateBp || true
        if [[ ! -z $(git status -s) ]]; then
          git status
        fi

    # 4. رفع الـ APK الناتج كنتاج للعملية (Artifact)
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/*.apk
