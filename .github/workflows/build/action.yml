name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    # تعديل الأمر لتجميع نسخة الـ release بدلاً من debug
    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - name: Generate Android.bp
      shell: bash
      run: |
        ./gradlew app:generateBp
        if [[ ! -z $(git status -s) ]]; then
          git status
          exit -1
        fi

    # تعديل اسم الملف ومسار مخرجات الـ release APK
    - uses: actions/upload-artifact@v7
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/app-release.apk
        archive: false
