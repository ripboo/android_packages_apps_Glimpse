name: build

runs:
  using: composite

  steps:
  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: 17
      cache: 'gradle'

  - name: Install System Tools (zipalign & apksigner)
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y zipalign apksigner

  - name: Grant execute permission for gradlew
    shell: bash
    run: chmod +x gradlew

  - name: Build Release with Gradle
    shell: bash
    run: ./gradlew assembleRelease

  - name: Generate Android.bp
    shell: bash
    run: |
      ./gradlew app:generateBp
      if [[ ! -z $(git status -s) ]]; then
        git status
        exit 1
      fi

  - name: Align and Sign APK
    shell: bash
    run: |
      # 1. البحث عن ملف الـ APK الناتج من بناء Release
      RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

      # 2. عمل المحاذاة (Zipalign)
      zipalign -f -p 4 "$RAW_APK" aligned.apk

      # 3. توليد مفتاح توقيع مؤقت
      keytool -genkeypair -v \
        -keystore temp_key.jks \
        -storetype PKCS12 \
        -alias mykeyalias \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -storepass "MbSecurePassword129" \
        -keypass "MbSecurePassword129" \
        -dname "CN=MySelfSignedApp, O=Development, C=US"

      # 4. توقيع ملف الـ APK
      apksigner sign \
        --ks temp_key.jks \
        --ks-pass pass:MbSecurePassword129 \
        --key-pass pass:MbSecurePassword129 \
        --ks-key-alias mykeyalias \
        --out final_signed_app.apk \
        aligned.apk

  - name: Upload Final Signed APK
    uses: actions/upload-artifact@v4
    with:
      name: Signed-App
      path: final_signed_app.apk
